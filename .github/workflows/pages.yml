name: Publicar SOC Lens en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.lock.txt
      - name: Comprobar el análisis
        run: python -m pytest -q
      - name: Generar la web estática y su ejemplo sintético
        run: python scripts/build_browser.py --output docs
      - name: Comprobar JavaScript
        run: |
          node --check docs/app.js
          node --check docs/browser.js
          node --check docs/browser-worker.js
          node --check docs/default-case.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
